<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEXIUM Trade</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .back {
      color: #aaa;
      font-size: 14px;
    }

    main {
      padding: 18px;
    }

    .token-header {
      background: #15151c;
      border: 1px solid #25252e;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .token-name {
      font-size: 22px;
      font-weight: bold;
    }

    .price {
      font-size: 30px;
      margin-top: 10px;
    }

    .green {
      color: #38d996;
    }

    .chart {
      height: 220px;
      background: #101016;
      border-radius: 12px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
    }

    .trade-box {
      background: #15151c;
      border: 1px solid #25252e;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border-radius: 9px;
      border: none;
      background: #101016;
      color: #888;
      font-weight: bold;
    }

    .tab.active {
      background: white;
      color: black;
    }

    label {
      display: block;
      color: #888;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      border: 1px solid #292932;
      background: #101016;
      color: white;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .buy {
      width: 100%;
      background: #38d996;
      color: #07130e;
      font-size: 16px;
      padding: 15px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .info-card {
      background: #101016;
      padding: 12px;
      border-radius: 9px;
    }

    .info-card small {
      display: block;
      color: #777;
      margin-bottom: 5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #111116;
      border-top: 1px solid #25252e;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      color: #888;
      font-size: 12px;
      text-align: center;
    }

    .nav-item.active {
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">KEXIUM</div>
    <a href="index.html" class="back">← Dashboard</a>
  </header>

  <main>

    <div class="token-header">
      <div class="token-name">🟣 NOVA · $NOVA</div>
      <div class="price">$0.00245</div>
      <div class="stat">Market Cap<br><strong>$245K</strong></div>
      <div class="stat">Liquidity<br><strong>$82K</strong></div>
      <div class="stat">24H Volume<br><strong>$391K</strong></div>
      <div class="green">+38.4% 24H</div>

      <div class="chart">
        📈 NOVA PRICE CHART
      </div>
    </div>

    <div class="trade-box">

      <div class="tabs">
        <button class="tab active" onclick="showBuy()">BUY</button>
        <button class="tab" onclick="showSell()">SELL</button>
      </div>

      <div class="order-type">
  <label>Order Type</label>
  <select id="orderType" onchange="changeOrderType()">
    <option value="market">Market</option>
    <option value="limit">Limit</option>
    <option value="stop">Stop</option>
  </select>
      </div>

      <div id="limitPriceBox" style="display:none;">
  <label>Limit Price</label>
  <input type="number" id="limitPrice" placeholder="Price (USD)" step="0.000001">
      </div>

      <div id="stopPriceBox" style="display:none;">
  <label>Stop Price</label>
  <input type="number" id="stopPrice" placeholder="Price (USD)" step="0.000001">
      </div>

      <label>Amount (SOL)</label>
      
      <input type="number" id="solAmount" placeholder="Amount (SOL)" oninput="calculateNova()">
      <label>Estimated NOVA</label>
      <input type="text" id="novaAmount" placeholder="Estimated NOVA" readonly>

      <button class="buy">BUY NOVA</button>

      <div class="info">
        <div class="info-card">
          <small>Liquidity</small>
          $82K
        </div>

        <div class="info-card">
          <small>24H Volume</small>
          $391K
        </div>

        <div class="info-card">
          <small>Buy Pressure</small>
          78%
        </div>

        <div class="info-card">
          <small>Network</small>
          Solana
        </div>
      </div>

    </div>

  </main>

  <nav class="bottom-nav">
    <div class="nav-item">🏠<br>Home</div>
    <div class="nav-item">🔥<br>Discover</div>
    <div class="nav-item active">📈<br>Trade</div>
    <div class="nav-item">👥<br>Social</div>
    <div class="nav-item">👤<br>Profile</div>
  </nav>

  
  <script>
  function showBuy() {
    document.querySelectorAll(".tab")[0].classList.add("active");
    document.querySelectorAll(".tab")[1].classList.remove("active");

    document.querySelector(".buy").textContent = "BUY NOVA";
    document.querySelector("#solAmount").placeholder = "Amount (SOL)";
  }

  function showSell() {
    document.querySelectorAll(".tab")[0].classList.remove("active");
    document.querySelectorAll(".tab")[1].classList.add("active");

    document.querySelector(".buy").textContent = "SELL NOVA";
    document.querySelector("input[placeholder='Amount (SOL)']").placeholder = "Amount (NOVA)";
  }

  function changeOrderType() {
    const orderType = document.getElementById("orderType").value;

    document.getElementById("limitPriceBox").style.display =
      orderType === "limit" ? "block" : "none";

    document.getElementById("stopPriceBox").style.display =
      orderType === "stop" ? "block" : "none";
  }

  function calculateNova() {
    const amount = parseFloat(document.getElementById("solAmount").value) || 0;
    const novaPrice = 0.00245;

    if (document.querySelector(".buy").textContent === "BUY NOVA") {
      const novaAmount = amount / novaPrice;

      document.getElementById("novaAmount").value =
        novaAmount > 0 ? novaAmount.toFixed(2) : "";
    } else {
      const solAmount = amount * novaPrice;

      document.getElementById("novaAmount").value =
        solAmount > 0 ? solAmount.toFixed(6) + " SOL" : "";
    }
  }
  </script>
    
</body>
  </html>
